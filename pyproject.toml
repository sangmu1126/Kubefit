[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kubefit"
version = "0.3.2"
description = "GitOps-first Kubernetes resource optimization"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
kubefit = "api.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "collector", "recommender", "evaluator", "gitops", "benchmarks", "safety"]
exclude = [
  "/benchmarks/results/**",
  "/benchmarks/pairs/**",
  "/benchmarks/campaigns/**",
  "/benchmarks/campaign-evidence/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
